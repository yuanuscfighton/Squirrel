<!DOCTYPE html>
<html lang = "en">
<head>
  <meta charset = "UTF-8">
  <!-- Create 2025/1/17 22:56 -->
  <title>l3-全局作用域</title>
</head>
<body>
  <script>
    // 全局作用域
    // 在全局作用域下声明了 num 变量
    const num = 10;
    function fn() {
      // 函数内部可以使用全局作用域的变量
      console.log(num);
    }
    // 此处全局作用域
  </script>
</body>
</html>
